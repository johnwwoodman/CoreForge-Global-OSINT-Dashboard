name: Collect intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

# Keep the existing workflow filename. Coordinate commits with the country-data
# workflow if that workflow uses the same concurrency group.
concurrency:
  group: coreforge-data-updates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect intelligence feeds
        run: python scripts/collect_feeds.py

      - name: Commit updated feed snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-feed.js data/live-feed.json
          if git diff --cached --quiet; then
            echo 'No feed changes to commit.'
            exit 0
          fi

          git commit -m 'Update public RSS snapshot'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo 'Rebase conflict: refusing to overwrite remote changes.' >&2
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'Could not push after five attempts.' >&2
          exit 1

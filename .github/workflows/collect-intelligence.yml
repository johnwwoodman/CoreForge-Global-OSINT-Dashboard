name: Collect Intelligence Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'

permissions:
  contents: write

concurrency:
  group: intelligence-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect RSS intelligence
        run: python scripts/collect_feeds.py

      - name: Commit updated intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update intelligence feeds"
            git push
          fi

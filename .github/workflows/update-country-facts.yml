name: Update country intelligence
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: country-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ISO country mapping
        run: python -m pip install pycountry==24.6.1
      - name: Refresh country intelligence
        run: python scripts/update_country_facts.py
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/country-facts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh country intelligence snapshot'
            git push
          fi

name: Update country intelligence
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: country-data-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ISO country mapping
        run: python -m pip install pycountry==24.6.1
      - name: Refresh country intelligence
        run: python scripts/update_country_facts.py
      - name: Refresh political leadership candidates
        run: python scripts/update_leadership.py
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/country-facts.json
          if git diff --cached --quiet; then
            echo 'No country data changes'
            exit 0
          fi
          git commit -m 'Refresh country intelligence snapshot'
          # Other workflows can push to main during collection. Rebase on
          # their commits and retry rather than force-pushing or losing data.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Country snapshot conflicts with a concurrent update; leaving remote unchanged.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Country snapshot published'
              exit 0
            fi
            echo "Concurrent push detected (attempt $attempt); retrying..."
            sleep $((attempt * 3))
          done
          echo 'Could not publish after five attempts; remote data remains unchanged.' >&2
          exit 1
